name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[test]"

    - name: Run unit tests with coverage
      run: |
        source .venv/bin/activate
        python -m pytest -m "not integration" --cov=pia_mcp_server --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  integration:
    name: Integration (live remote server)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[test]"

    - name: Run integration tests against the remote server
      env:
        PIA_API_KEY: ${{ secrets.PIA_API_KEY }}
      run: |
        source .venv/bin/activate
        python -m pytest -m integration -p no:cacheprovider --no-cov
