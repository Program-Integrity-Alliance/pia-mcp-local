name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so the scan covers every commit, not just the tip.
        fetch-depth: 0

    - name: Install gitleaks
      env:
        # Pinned for reproducibility. The gitleaks CLI is used directly because
        # the gitleaks-action requires a paid license for organization repos.
        GITLEAKS_VERSION: "8.21.2"
      run: |
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
        tar -xzf gitleaks.tar.gz gitleaks
        sudo install gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Scan git history for secrets
      run: |
        gitleaks detect --source . --redact --verbose --exit-code 1

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[security]"

    - name: Audit runtime dependencies for known vulnerabilities
      run: |
        source .venv/bin/activate
        uv export --no-dev --no-emit-project --no-hashes -o runtime-requirements.txt
        pip-audit --no-deps -r runtime-requirements.txt

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[security]"

    - name: Scan source for insecure code patterns
      run: |
        source .venv/bin/activate
        bandit -r src/
